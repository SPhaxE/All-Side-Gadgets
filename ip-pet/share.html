<title>暖橙水滴和朋友</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 深灰「画板胶片」放 8 步复刻 → pet-forge 流程 → 两只桌宠舞台 + 控制台 → 迪士尼法则对照 */
:root {
  --bg: #f4f2f3; --surface: #ffffff; --ink: #2a2426; --muted: #6f6467; --line: #e2dcde;
  --strip: #444043; --artboard: #ffffff; --artboard-ink: #222;
  --accent: #f0533a; --chip: #f7eef0; --stage-top: #fff8f3; --stage-floor: #f3e7e2;
  --ok: #2f8f5b; --warn: #c27a00; --bad: #c8372d;
  --f-display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1a1c; --surface: #272325; --ink: #f2ecee; --muted: #b0a4a8; --line: #3a3437;
  --strip: #121011; --accent: #ff7a5e; --chip: #332d30; --stage-top: #2b2426; --stage-floor: #382d2c;
  --ok: #6cc795; --warn: #f0b35a; --bad: #ff7a70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1d1a1c; --surface: #272325; --ink: #f2ecee; --muted: #b0a4a8; --line: #3a3437;
  --strip: #121011; --accent: #ff7a5e; --chip: #332d30; --stage-top: #2b2426; --stage-floor: #382d2c;
  --ok: #6cc795; --warn: #f0b35a; --bad: #ff7a70; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 48px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .02em; }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.15; }
h2 { font-size: 26px; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 62ch; }
header { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
header .mini { width: 92px; height: 92px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
section { display: flex; flex-direction: column; gap: 18px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.sec-head > div:first-child { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }
code { font-family: var(--f-mono); font-size: .9em; background: var(--chip); padding: 0 4px; border-radius: 3px; }

/* ---------- 8 步复刻 ---------- */
.strip { background: var(--strip); border-radius: 6px; padding: 14px; display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 860px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; gap: 10px; } }
.card { background: var(--artboard); color: var(--artboard-ink); display: flex; flex-direction: column; padding: 10px 10px 14px; gap: 8px; margin: 0; }
.card .art { position: relative; aspect-ratio: 400 / 360; max-width: 100%; }
.card .art > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .art img { object-fit: cover; opacity: 0; transition: opacity .25s; }
.card .art .tag { inset: auto auto 4px 4px; width: auto; height: auto; font: 600 10px/1 var(--f-mono); letter-spacing: .08em; padding: 4px 6px; border-radius: 3px; background: #222; color: #fff; opacity: 0; transition: opacity .25s; }
.strip[data-view="ref"] .art img, .strip[data-view="ref"] .art .tag, .card:hover .art img, .card:hover .art .tag, .card:focus-within .art img { opacity: 1; }
.card .cap { display: flex; gap: 8px; align-items: baseline; }
.card .num { font: 600 12px/1 var(--f-mono); color: #c0392b; }
.card .ttl { font-weight: 700; font-size: 15px; }
.card .param { font: 11px/1.5 var(--f-mono); color: #6a5f62; min-height: 3em; }
.card .grad-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff413b, #fcd685); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--f-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, .pet-host:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 流程 ---------- */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.flow li { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.flow b { font-size: 14px; }
.flow .k { font: 600 11px var(--f-mono); color: var(--accent); letter-spacing: .08em; }
.flow span { font-size: 13px; color: var(--muted); }

/* ---------- 角色卡 ---------- */
.cast { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .cast { grid-template-columns: minmax(0, 1fr); } }
.who { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; font: inherit; }
.who[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.who svg { width: 84px; height: 84px; overflow: visible; }
.who b { font-family: var(--f-display); font-weight: 400; font-size: 20px; display: block; }
.who small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
.who .sw { display: flex; gap: 4px; margin-top: 6px; }
.who .sw i { width: 14px; height: 14px; border-radius: 50%; display: block; }

/* ---------- 舞台 ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .play { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; height: 440px; border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(var(--stage-top) 0 80%, var(--stage-floor) 80% 100%); border: 1px solid var(--line); }
.stage .hud { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; font: 12px var(--f-mono); color: var(--muted); }
.stage .hud b { color: var(--ink); font-weight: 600; }
.pet-host { position: absolute; left: 0; top: 0; width: 230px; height: 230px; cursor: grab; touch-action: none; will-change: transform; }
.pet-host.dragging { cursor: grabbing; }
.pet-host svg { width: 100%; height: 100%; overflow: visible; display: block; }
.shadow { position: absolute; left: 0; top: 0; height: 26px; border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.hint { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
.console { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.console h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.console h3 small { font: 11px var(--f-mono); color: var(--muted); font-weight: 400; }
.grid-btn { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 4px; padding: 5px 8px; cursor: pointer; font: 12px var(--f-mono); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cls { font-size: 10px; font-weight: 600; padding: 0 4px; border-radius: 3px; border: 1px solid currentColor; opacity: .85; }
.cls-A { color: var(--ok); } .cls-B { color: var(--warn); } .cls-C { color: var(--bad); }
.chip[aria-current="true"] .cls { color: inherit; }
.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.ev span { font: 11px var(--f-mono); color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.row label { color: var(--muted); }
.row input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.row output { font: 12px var(--f-mono); min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
.log { font: 12px/1.6 var(--f-mono); background: var(--bg); border-radius: 4px; padding: 8px 10px; height: 128px; overflow: auto; margin: 0; list-style: none; }
.log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.log li b { color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 7px 12px; cursor: pointer; font: 500 13px var(--f-body); }
.btn.ghost { background: transparent; color: var(--ink); }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--f-mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td b { white-space: nowrap; }
</style>
<style>
/* 分享页：手机优先。信息用版式分层而不是靠说明文字：
   名字（大）+ 性格标签 + 实时心情 → 舞台 → 地面上的角色切换（缩略图 + 名字）→ 一行手势提示 */
html, body { height: 100%; }
body { background: var(--bg); overflow: hidden; }
.share { height: 100%; max-width: 460px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.share .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 20px 12px; }
.share .who-now { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.share .who-now h1 { font-size: clamp(34px, 11vw, 46px); line-height: 1; }
.share .who-now p { color: var(--muted); font-size: 13px; letter-spacing: .08em; }
.share .mood { flex: none; font: 600 12px var(--f-body); padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); transition: background .3s; }
.share .stage { position: relative; height: auto; border: 0; border-radius: 0; }
.share .cast { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 22px; z-index: 2; }
.share .who { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; box-shadow: none; }
.share .who .thumb { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 65%, transparent); transition: transform .25s, background .25s; }
.share .who svg { width: 48px; height: 48px; }
.share .who[aria-pressed="true"] .thumb { background: var(--surface); transform: translateY(-4px); box-shadow: 0 6px 18px rgb(0 0 0 / .12); }
.share .who > span:last-child { display: block; }
.share .who > span:last-child b { font-family: var(--f-body); font-weight: 600; font-size: 12px; }
.share .who > span:last-child small, .share .who .sw { display: none; }
.share .who[aria-pressed="false"] > span:last-child b { color: var(--muted); font-weight: 400; }
.share .hints { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; padding: 12px 16px max(16px, env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted); }
.share .hints b { color: var(--ink); font-weight: 600; margin-right: 3px; }
@media (min-width: 600px) and (min-height: 760px) {
  body { display: grid; place-items: center; }
  .share { height: min(900px, calc(100% - 40px)); width: 100%; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
}
.fx-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.pet-svg { shape-rendering: geometricPrecision; }
</style>

<main class="share">
  <header class="top">
    <div class="who-now"><h1 id="pet-name">小橙</h1><p id="pet-tag">元气 · 好奇</p></div>
    <span class="mood" id="pet-mood" aria-live="polite">登场</span>
  </header>
  <div class="stage" id="stage" aria-label="桌宠舞台">
    <div class="shadow" id="shadow"></div>
    <div class="pet-host" id="pet-host" tabindex="0" role="img" aria-label="桌宠"></div>
    <svg class="fx-layer" id="fx-layer" aria-hidden="true"></svg>
    <div class="cast" id="cast" role="group" aria-label="选择角色"></div>
  </div>
  <footer class="hints"><span><b>拖</b>拎起来</span><span><b>甩</b>抛出去</span><span><b>点</b>戳一下</span><span><b>连点三下</b>开心</span><span><b>不理它</b>会睡着</span></footer>
</main>

<script>
(() => {
'use strict';
// 页面元素按需取：不存在时给一个游离占位元素，同一份引擎既能跑完整验收页，也能跑精简分享页
const $ = id => document.getElementById(id) || document.createElement('div');
/* =====================================================================
   0. 曲线工具：闭合均匀三次 B 样条（C2 连续 ⇒ G2）+ 最小二乘拟合
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const TAU = Math.PI * 2;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const AMP = REDUCED ? 0.4 : 1;           // 减少动态：压低幅度，不去掉动画

function bspline(P) {                     // P: [[x,y]...] 控制点 → SVG 路径
  const n = P.length; let d = '';
  for (let i = 0; i < n; i++) {
    const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n], e = P[(i + 2) % n];
    if (i === 0) d += `M${r2((a[0] + 4 * b[0] + c[0]) / 6)} ${r2((a[1] + 4 * b[1] + c[1]) / 6)}`;
    d += `C${r2((2 * b[0] + c[0]) / 3)} ${r2((2 * b[1] + c[1]) / 3)} ${r2((b[0] + 2 * c[0]) / 3)} ${r2((b[1] + 2 * c[1]) / 3)} ${r2((b[0] + 4 * c[0] + e[0]) / 6)} ${r2((b[1] + 4 * c[1] + e[1]) / 6)}`;
  }
  return d + 'Z';
}
const basis = t => { const t2 = t * t, t3 = t2 * t; return [(1 - t) ** 3 / 6, (3 * t3 - 6 * t2 + 4) / 6, (-3 * t3 + 3 * t2 + 3 * t + 1) / 6, t3 / 6]; };
function curvePts(P, m = 12) {            // 在曲线上密采样
  const n = P.length, out = [];
  for (let i = 0; i < n; i++) for (let s = 0; s < m; s++) {
    const w = basis(s / m), idx = [i - 1, i, i + 1, i + 2].map(k => P[(k + n) % n]);
    out.push([w.reduce((a, wk, k) => a + wk * idx[k][0], 0), w.reduce((a, wk, k) => a + wk * idx[k][1], 0)]);
  }
  return out;
}
function solve(A, b) {                    // 高斯消元（K 很小）
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function fitClosed(S, us, K) {            // 已知每个样本的参数 u∈[0,K)，解 K 个控制点
  const A = Array.from({ length: K }, () => new Array(K).fill(0)), bx = new Array(K).fill(0), by = new Array(K).fill(0);
  S.forEach((p, j) => {
    const u = us[j], i = Math.floor(u), w = basis(u - i), idx = [i - 1, i, i + 1, i + 2].map(k => ((k % K) + K) % K);
    for (let a = 0; a < 4; a++) { bx[idx[a]] += w[a] * p[0]; by[idx[a]] += w[a] * p[1]; for (let b = 0; b < 4; b++) A[idx[a]][idx[b]] += w[a] * w[b]; }
  });
  for (let i = 0; i < K; i++) A[i][i] += 1e-6;
  const X = solve(A, bx), Y = solve(A, by);
  return X.map((x, i) => [x, Y[i]]);
}
const R_BODY = 6, R_FACE = 1.5, R_FX = 1;
// 凸性守护：均匀 B 样条有「变差缩减」性质——控制多边形是凸的，曲线就一定是凸的（没有拐点、没有凹坑）。
// 对本应外凸的角色，把向内折的锚点推回两邻点连线外侧一点点即可。
function convexGuard(P, passes = 8) {
  const n = P.length; P = P.map(p => [p[0], p[1]]);
  let A = 0; for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; A += p[0] * q[1] - q[0] * p[1]; }
  const o = Math.sign(A);
  for (let k = 0; k < passes; k++) {
    let ok = true;
    for (let i = 0; i < n; i++) {
      const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n], cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (cr * o < .02) { ok = false; const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2, tx = c[0] - a[0], ty = c[1] - a[1], L = Math.hypot(tx, ty) || 1; b[0] = mx + o * ty / L * .15; b[1] = my - o * tx / L * .15; }
    }
    if (ok) break;
  }
  return P;
}   // 最小曲率半径（单位）：身体 / 五官 / 特效
// 圆角守护：任何时刻曲线上任意点的曲率半径都不小于 rmin。
// 在拼接点（t=0）和段中点（t=0.5）检查，过紧处把相关锚点向邻点中点松弛，迭代至满足。
function bsR(a, b, c, e, t) {
  const d1x = .5 * ((c[0] - a[0]) + 2 * t * (a[0] - 2 * b[0] + c[0]) + t * t * (-a[0] + 3 * b[0] - 3 * c[0] + e[0]));
  const d1y = .5 * ((c[1] - a[1]) + 2 * t * (a[1] - 2 * b[1] + c[1]) + t * t * (-a[1] + 3 * b[1] - 3 * c[1] + e[1]));
  const d2x = (a[0] - 2 * b[0] + c[0]) + t * (-a[0] + 3 * b[0] - 3 * c[0] + e[0]), d2y = (a[1] - 2 * b[1] + c[1]) + t * (-a[1] + 3 * b[1] - 3 * c[1] + e[1]);
  const cr = Math.abs(d1x * d2y - d1y * d2x); return cr < 1e-9 ? Infinity : Math.hypot(d1x, d1y) ** 3 / cr;
}
function roundGuard(P, rmin, passes = 14) {
  const n = P.length; P = P.map(p => [p[0], p[1]]);
  const relax = (i, f) => { const a = P[(i - 1 + n) % n], c = P[(i + 1) % n], b = P[i]; b[0] += ((a[0] + c[0]) / 2 - b[0]) * f; b[1] += ((a[1] + c[1]) / 2 - b[1]) * f; };
  for (let k = 0; k < passes; k++) {
    let ok = true;
    for (let i = 0; i < n; i++) {
      const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n], e = P[(i + 2) % n];
      const r0 = bsR(a, b, c, e, 0);
      if (r0 < rmin) { ok = false; relax(i, clamp(1 - r0 / rmin, .15, .6)); }

  if (phys.drag) {
    const k = 380, c = 28;
    phys.vx += (k * (phys.tx - phys.x) - c * phys.vx) * dt; phys.vy += (k * (phys.ty - phys.y) - c * phys.vy) * dt;
    phys.x += phys.vx * dt; phys.y = Math.max(0, phys.y + phys.vy * dt);
  } else if (!phys.grounded || phys.y > 0 || phys.vy > 0) {
    phys.vy -= G * dt; phys.y += phys.vy * dt; phys.x += phys.vx * dt;
    if (phys.y <= 0) {
      phys.y = 0; const imp = -phys.vy;
      if (imp > 140) {                                              // 落地：偏向压扁形 + 锚点果冻 + 回弹 + 色团下压
        phys.vy = imp * .34; phys.vx *= .7;
        const P = pet.P; P.sq.v += imp * .03 * pet.ch.exag * AMP; pet.kickJelly(imp * .03 * AMP); pet.sly.v += imp * .08; pet.speed.v += imp * .004;
        if (P.ext) { P.ext.forEach(e => { e.v += imp * .004 * AMP; }); P.bend[2].v -= imp * .004 * AMP; P.bend[3].v += imp * .004 * AMP; }   // 尖角着地张开
        else { P.cdir.v += imp * .5 * AMP * (Math.random() < .5 ? -1 : 1); P.m.v += imp * .004 * AMP; }               // 方角甩一下
        phys.impacts++;
      } else { phys.vy = 0; phys.grounded = true; if (state === 'react-drag') setState('idle', '落地站稳'); }
    }
  } else { phys.vx *= Math.exp(-7 * dt); phys.x += phys.vx * dt; }
  if (phys.x < half) { phys.x = half; phys.vx = Math.abs(phys.vx) * .5; pet.kickJelly(15); }
  if (phys.x > W - half) { phys.x = W - half; phys.vx = -Math.abs(phys.vx) * .5; pet.kickJelly(15); }
  phys.ax = phys.ax * .7 + ((phys.vx - vx0) / Math.max(dt, 1e-3)) * .3;
  phys.ay = phys.ay * .7 + (-(phys.vy - vy0) / Math.max(dt, 1e-3)) * .3;
}
function renderFx(now, dt) {
  const s = u2p(), ch = pet.ch, T = ch.T, out = [], col = ch.accent;
  // 特效锚点：头部右上方，弹簧滞后跟随
  const hx = phys.x + (ch.cx + 42 - 100) * s, hy = floorY() - phys.y - (GROUND - pet.topY() + 10) * s;
  fxA.x.t = hx; fxA.y.t = hy; fxA.x.step(dt); fxA.y.step(dt); keysX.t = phys.x; keysX.step(dt);
  const ax = fxA.x.x, ay = fxA.y.x;
  const draw = (P, ox, oy, sc, fill) => out.push(`<path d="${bspline(roundGuard(P, R_FX).map(p => [ox + p[0] * sc, oy + p[1] * sc]))}" fill="${fill}"/>`);
  if (state === 'sleeping' || (state === 'collapse-sleep' && now - stT > 700 * T)) { if (now - lastZ > 1000 * T) { lastZ = now; particles.push({ k: 'z', x: ax, y: ay, vx: 16, vy: -30, t0: now, life: 2800 * T }); } }
  if (state === 'error' && now - lastSweat > 1700 * T) { lastSweat = now; particles.push({ k: 'drop', x: phys.x + 30 * s, y: floorY() - phys.y - (GROUND - pet.topY() - 18) * s, vx: 0, vy: 10, t0: now, life: 1400 }); }
  particles = particles.filter(p => now - p.t0 < p.life);
  for (const p of particles) {
    const f = (now - p.t0) / p.life;
    p.x += (p.vx + (p.k === 'z' ? 10 * Math.sin(f * 7) : 0)) * dt; p.y += p.vy * dt; if (p.k === 'drop') p.vy += 60 * dt;
    const m = Math.min(1, f / .18, (1 - f) / .25), gl = glyph(p.k), e = m * m * (3 - 2 * m);
    draw(lerpPts(gl.dot.P || gl.dot, gl.P, e), p.x, p.y, s * (p.k === 'z' ? 1.05 : 1.1), p.k === 'drop' ? '#8fd3ff' : col);
  }
  for (const k in fxLv) fxLv[k].step(dt);
  const d = fxLv.dots.x;
  if (d > .02) for (let k = 0; k < 3; k++) { const r = (2.4 + 1.1 * Math.sin(now / 180 - k * 1.2)) * clamp(d, 0, 1.2) * s; draw(ellipseLoop(0, 0, r, r, 24).filter((_, i) => i % 3 === 0), ax + k * 11 * s, ay + 4 * s - 3 * Math.max(0, Math.sin(now / 180 - k * 1.2)) * s, 1, col); }
  const b = fxLv.bang.x;
  if (b > .01) { const e = clamp(b, 0, 1.3); for (const [n, fill, oy] of [['badge', col, 0], ['bar', '#fff', -2.6], ['pt', '#fff', 6]]) { const gl = glyph(n); draw(lerpPts(gl.dot, gl.P, e), ax + 6 * s, ay + oy * s * Math.min(1, e), s, fill); } }
  const kk = fxLv.keys.x;
  if (kk > .01) for (let k = 0; k < 5; k++) { const gu = glyph('key'), gd = glyph('keyDown'), press = Math.max(0, Math.sin(now / 95 + k * 2.2)); const shape = lerpPts(gu.P, gd.P, press); draw(lerpPts(gu.dot, shape, clamp(kk, 0, 1)), keysX.x + (k - 2) * 20 * s, floorY() + 16, s, mix(col, '#ffffff', .45)); }
  fxSvg.innerHTML = out.join('');
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.033, (now - lastF) / 1000); lastF = now;
  if (!visible || !pet) return;
  for (const tm of timers.splice(0)) { if (tm.g !== gen_) continue; if (now >= tm.at) tm.fn(); else timers.push(tm); }
  const g = behave(pet, state, now - stT, ctx);
  const air = !phys.grounded || phys.y > .5, star = pet.ch === CHARS.berry;
  let sq = g.p.sq ?? 0;
  if (phys.drag) {                                   // 拎着：拉长、按速度摆，角 / 尖角拖在运动后面（跟随）
    sq = Math.min(sq, -.4 - clamp(Math.abs(phys.vy) * .0006, 0, .6));
    g.p.rot = (g.p.rot ?? 0) + clamp(phys.vx * .012, -16, 16);
    if (star) g.p.bend = (g.p.bend || [0, 0, 0, 0, 0]).map(b => clamp(b - phys.vx * .0009, -.34, .34));
    else g.p.cdir = (g.p.cdir ?? 0) + clamp(-phys.vx * .035, -42, 42);
  } else if (air) sq = Math.min(sq, -clamp(Math.abs(phys.vy) * .0011 * pet.ch.exag * AMP, 0, 1.1));
  g.p.sq = sq; pet.target(g.p); pet.rFloor.t = g.rFloor;
  pet.warm.t = g.warm; pet.cool.t = g.cool; pet.grey.t = g.grey; pet.speed.t = clamp(Math.hypot(phys.vx, phys.vy) / 1400, 0, 1);
  fxLv.dots.t = g.fx.dots ? 1 : 0; fxLv.bang.t = g.fx.bang ? 1 : 0; fxLv.keys.t = g.fx.keys ? 1 : 0;
  // 视线（整张脸平移）
  if (g.gaze) { pet.gx.t = g.gaze[0]; pet.gy.t = g.gaze[1]; }
  else if (pointer.inside && ['open', 'wide', 'half'].includes(pet.face.eyes)) {
    const cx = phys.x, cy = floorY() - phys.y - SZ * .3, dx = pointer.x - cx, dy = pointer.y - cy, dd = Math.hypot(dx, dy) || 1, k = Math.min(1, dd / 160);
    pet.gx.t = dx / dd * 4 * k; pet.gy.t = dy / dd * 2.5 * k;
  } else { pet.gx.t = 0; pet.gy.t = 0; }
  pet.fox.t = clamp(-phys.vx * .006, -5, 5); pet.foy.t = clamp(phys.vy * .004, -5, 5);
  // 指针光斑：靠近亮起、按下更亮，位置带滞后
  if (pointer.inside) { const [sx, sy] = toSvg(pointer.x, pointer.y); pet.lx.t = clamp(sx, 40, 160); pet.ly.t = clamp(sy, 60, 150); }
  pet.lightA.t = pressed ? 1 : ctx.near ? .8 : 0;
  if (now > nextBlink) {
    const [mn, mx, du] = pet.ch.blink; nextBlink = now + mn + Math.random() * (mx - mn);
    if (['open', 'wide', 'half', 'sad', 'angry'].includes(pet.face.eyes)) { pet.blink(now, du); if (pet.ch === CHARS.berry && Math.random() < .3) setTimeout(() => pet.blink(performance.now(), du), du + 140); }
  }
  const sub = dt > .017 ? 2 : 1;
  for (let i = 0; i < sub; i++) { physicsStep(dt / sub); pet.step(dt / sub, now, phys.ax, phys.ay); }
  pet.render(); renderFx(now, dt);
  const s = u2p();
  host.style.transform = `translate3d(${(phys.x - SZ / 2).toFixed(2)}px, ${(floorY() - phys.y - GROUND * s).toFixed(2)}px, 0)`;
  const shW = SZ * pet.ch.shadow[1] * (1 - clamp(phys.y / 420, 0, .6)) * (pet.widthNow() / 120);
  shadowEl.style.width = shW.toFixed(1) + 'px';
  shadowEl.style.transform = `translate3d(${(phys.x - shW / 2 + 6 * s).toFixed(2)}px, ${(floorY() - 13).toFixed(2)}px, 0)`;
  shadowEl.style.opacity = (1 - clamp(phys.y / 500, 0, .65)).toFixed(3);
  const hudSleep = $('hud-sleep');
  if (state === 'idle' && !phys.drag && phys.grounded) {
    const IDLE = (+$('idle-ms').value || pet.ch.sleepS) * 1000, left = Math.max(0, IDLE - (now - lastInput));
    hudSleep.textContent = `入睡倒计时 ${Math.ceil(left / 1000)} s`;
    if (left <= 0) setState('idle-yawn', `${IDLE / 1000}s 无事件`);
    else if (now > nextIdleAct) {
      nextIdleAct = now + (5000 + Math.random() * 5000) * pet.ch.T;
      if (pet.ch === CHARS.berry && Math.random() < .55) { pet.P.sq.v += 4; pet.P.bend.forEach((b, i) => { b.v += (i % 2 ? 4 : -4); }); setTimeout(() => ctx.hop(300), 110); log('<b>idle</b> · 噼啪坐不住，原地蹦一下'); }
      else if (Math.random() < .6) setState('idle-look', '随机');
    }
  } else hudSleep.textContent = state === 'sleeping' ? '睡着了 · 点一下叫醒' : '';
}

/* ---------- 角色卡 ---------- */
const cast = $('cast');
cast.innerHTML = Object.entries(CHARS).map(([k, ch]) => `
  <button class="who" data-k="${k}" aria-pressed="${k === curKey}">
    <span class="thumb" data-k="${k}"></span>
    <span><b>${ch.name}</b><small>${ch.tag}</small><small>${ch.blurb}</small>
      <span class="sw">${ch.palette.map(c => `<i style="background:${c}"></i>`).join('')}</span></span>
  </button>`).join('');
cast.querySelectorAll('.thumb').forEach(el => { const p = new Pet(el, CHARS[el.dataset.k], 'th-' + el.dataset.k, false); p.r.svg.setAttribute('viewBox', '15 15 170 170'); p.restPreview(); });
cast.addEventListener('click', e => { const b = e.target.closest('.who'); if (b && b.dataset.k !== curKey) mountPet(b.dataset.k, true); });

/* ---------- 控制台 ---------- */
$('state-btns').innerHTML = Object.entries(S).map(([k, v]) => `<button class="chip" data-s="${k}" aria-current="${k === 'idle'}">${k}<span class="cls cls-${v.c}">${v.c}</span></button>`).join('');
$('state-btns').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { touch(); setState(b.dataset.s, '手动'); } });
$('event-btns').innerHTML = EVENTS.map(([ev, st]) => `<button class="chip" data-ev="${ev}" data-s="${st}">${ev}</button><span>→ ${st}</span>`).join('');
$('event-btns').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return; touch();
  if (b.dataset.ev === 'Stop') base = 'idle';
  if (['sleeping', 'idle-dozing', 'collapse-sleep'].includes(state)) { queued = b.dataset.s; setState('wake', b.dataset.ev); } else setState(b.dataset.s, b.dataset.ev);
});
$('state-table').innerHTML = Object.entries(S).map(([k, v]) => `<tr><td><code>${k}</code></td><td><span class="cls cls-${v.c}">${v.c}</span></td><td>${v.d}</td><td>${v.tr}</td></tr>`).join('');
$('idle-ms').addEventListener('input', e => { $('idle-ms-out').textContent = e.target.value + ' s'; });
const anchorsBtn = $('anchors');
anchorsBtn.addEventListener('click', () => { pet.showAnchors = !pet.showAnchors; anchorsBtn.setAttribute('aria-pressed', pet.showAnchors); anchorsBtn.textContent = pet.showAnchors ? '隐藏锚点' : '显示锚点'; });
$('drop').addEventListener('click', () => { touch(); phys.y = stage.clientHeight * .7; phys.vy = 0; phys.vx = (Math.random() - .5) * 500; phys.grounded = false; if (state !== 'idle') setState('idle', '丢下'); });
$('copy-svg').addEventListener('click', async () => {
  const s = pet.r.svg.cloneNode(true); s.setAttribute('xmlns', NS); s.querySelector('.anchors').remove();
  const code = s.outerHTML, msg = $('copy-msg');
  try { await navigator.clipboard.writeText(code); msg.textContent = '已复制'; }
  catch { const ta = document.createElement('textarea'); ta.value = code; document.body.append(ta); ta.select(); msg.textContent = '已选中，按 Ctrl/Cmd+C 复制'; setTimeout(() => ta.remove(), 8000); }
});
function layout() { SZ = stage.clientWidth < 520 ? 190 : 230; host.style.width = host.style.height = SZ + 'px'; if (!phys.x) phys.x = stage.clientWidth / 2; }
window.addEventListener('resize', layout);

/* ---------- 自检接口（QA 用） ---------- */
window.__pet = {
  get state() { return state; }, get phys() { return phys; }, get pet() { return pet; }, CHARS, eyeFit, mouthFit, curvePts, bspline, OMEGA_FIT, OMEGA,
  setState: s => setState(s, 'test'), mount: k => mountPet(k, false),
  g2(P) {
    const n = P.length; let dA = 0, dK = 0;
    const seg = i => { const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n], e = P[(i + 2) % n]; return [[(a[0] + 4 * b[0] + c[0]) / 6, (a[1] + 4 * b[1] + c[1]) / 6], [(2 * b[0] + c[0]) / 3, (2 * b[1] + c[1]) / 3], [(b[0] + 2 * c[0]) / 3, (b[1] + 2 * c[1]) / 3], [(b[0] + 4 * c[0] + e[0]) / 6, (b[1] + 4 * c[1] + e[1]) / 6]]; };
    const kap = (d1, d2) => (d1[0] * d2[1] - d1[1] * d2[0]) / Math.hypot(...d1) ** 3;

      const d1b = [3 * (B[1][0] - B[0][0]), 3 * (B[1][1] - B[0][1])], d2b = [6 * (B[2][0] - 2 * B[1][0] + B[0][0]), 6 * (B[2][1] - 2 * B[1][1] + B[0][1])];
      let da = Math.abs(Math.atan2(d1a[1], d1a[0]) - Math.atan2(d1b[1], d1b[0])); if (da > Math.PI) da = TAU - da;

</script>
