<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>money-maxxing 五页汇报</title>
<style>
/* 第四版，从空白重做。规则：ppt-skill/…/iceppt-ppt/SKILL.md「版式先说话」——每页一个图形占主体，标题 ≤20 汉字，正文 ≤40 汉字。
   图形骨架取自图库范例（每页注释里写明），文字不照抄范例密度。 */
:root{
  --ink:#16181B; --g1:#5E6368; --g2:#9AA0A6; --g3:#C9CDD1; --g4:#E7E9EB; --g5:#F3F4F5;
  --acc:#12365C; --acc2:#5F82A8; --tint:#C9D7E6; --tint2:#E9EFF5;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Helvetica Neue",Arial,system-ui,sans-serif; --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#DFE2E5;overflow:hidden;font-family:var(--font);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;background:#fff;transform-origin:0 0;overflow:hidden}
section{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s}
section.on{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){section{transition:none}}
svg{position:absolute;left:0;top:0;font-family:var(--font)}
.kick{position:absolute;left:64px;top:40px;font:700 12px var(--num);letter-spacing:3px;color:var(--g2)}
.no{position:absolute;right:64px;top:34px;font:700 22px var(--num);color:var(--g3)}
.ttl{position:absolute;left:64px;top:62px;font-size:36px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.ttl b{color:var(--acc)}
#nav{position:absolute;left:64px;bottom:22px;display:flex;gap:6px}
#nav i{width:22px;height:3px;background:var(--g4);cursor:pointer}#nav i.on{background:var(--acc)}
</style>
</head>
<body>
<div id="stage">
<section><div class="kick">MONEY-MAXXING · 11/13</div><div class="no">01</div><div class="ttl">20 条开奖，<b>15 条命中</b></div><svg id="s1" width="1280" height="720"></svg></section>
<section><div class="kick">HOW IT WORKS</div><div class="no">02</div><div class="ttl">先登记，后判分</div><svg id="s2" width="1280" height="720"></svg></section>
<section><div class="kick">CALIBRATION</div><div class="no">03</div><div class="ttl">说 64%，<b>中了 82%</b></div><svg id="s3" width="1280" height="720"></svg></section>
<section><div class="kick">ACCOUNT</div><div class="no">04</div><div class="ttl">亏 1,580 元，<b>近六成在一只基金</b></div><svg id="s4" width="1280" height="720"></svg></section>
<section><div class="kick">DECISION</div><div class="no">05</div><div class="ttl">样本才 17 条，<b>攒到 30 条再调概率</b></div><svg id="s5" width="1280" height="720"></svg></section>
<div id="nav"></div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))};
  var C={ink:'#16181B',g1:'#5E6368',g2:'#9AA0A6',g3:'#C9CDD1',g4:'#E7E9EB',g5:'#F3F4F5',acc:'#12365C',acc2:'#5F82A8',tint:'#C9D7E6',tint2:'#E9EFF5'};
  var NUM='"Helvetica Neue",Arial,system-ui,sans-serif', SERIF='Georgia,"Times New Roman",serif';

  /* ================= 数据：origin/main 的 prediction_scorecard.md、STATUS.md（2026-11-13 结算） ================= */
  var REG=28, PENDING=8, LEGACY_J=3, LEGACY_HIT=1;
  // 17 条带概率且已判定的预测：[声称概率, 是否命中]
  var P=[[.65,1],[.45,1],[.48,1],[.60,1],[.60,1],[.55,1],[.52,0],[.68,1],[.75,1],[.65,0],[.72,1],[.72,1],[.78,1],[.68,1],[.70,1],[.55,1],[.78,0]];
  // 6 只基金的累计盈亏（元）
  var F=[['110020','沪深300',-912.14],['110027','安心回报',-361.83],['012733','人工智能',-241.40],['024430','东方红',-50.71],['012737','创新药',-34.40],['014437','同业存单',20.42]];
  var sum=function(a){return a.reduce(function(x,y){return x+y},0)}, avg=function(a){return sum(a)/a.length};
  var hitsP=sum(P.map(function(r){return r[1]})), JUDGED=P.length+LEGACY_J, HITS=hitsP+LEGACY_HIT, MISS=JUDGED-HITS;
  var claim=avg(P.map(function(r){return r[0]})), actual=hitsP/P.length, brier=avg(P.map(function(r){return Math.pow(r[0]-r[1],2)}));
  var pnl=sum(F.map(function(f){return f[2]})), PRINCIPAL=25753.42;
  console.assert(JUDGED===20&&HITS===15&&MISS===5&&JUDGED+PENDING===REG,'counts');
  console.assert((claim*100).toFixed(1)==='63.9'&&(actual*100).toFixed(1)==='82.4'&&brier.toFixed(4)==='0.1932','calibration '+claim+' '+actual+' '+brier);
  console.assert(pnl.toFixed(2)==='-1580.06'&&(pnl/PRINCIPAL*100).toFixed(2)==='-6.14','pnl '+pnl);
  window.__deckCheck={judged:JUDGED,hits:HITS,claim:+(claim*100).toFixed(1),actual:+(actual*100).toFixed(1),brier:+brier.toFixed(4),pnl:+pnl.toFixed(2),share:+(F[0][2]/pnl*100).toFixed(1)};

  function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||16)+'" fill="'+(o.c||C.g1)+'" text-anchor="'+(o.a||'start')+'" font-weight="'+(o.w||400)+'"'+(o.f?' font-family=\''+o.f+'\'':'')+(o.i?' font-style="italic"':'')+(o.ls?' letter-spacing="'+o.ls+'"':'')+'>'+s+'</text>'}
  function fmt(v,d){return (v<0?'−':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}

  /* ---------- 01 桑基图 · 骨架取自 catalog/slides/0915-e7ee-04-3.jpg ---------- */
  (function(){
    var u=15, x1=150, x2=540, x3=920, w=16, top=190, gap=40, h='';
    var yJ=top, yP=top+JUDGED*u;                                   // 左柱内：已判 / 待判 的分界
    var y2P=top+JUDGED*u+gap;                                       // 中柱：待判块下移一个间隔
    var y3H=top-20, y3M=y3H+HITS*u+gap;                             // 右柱：命中 / 未中
    function band(xa,ya,xb,yb,ht,fill,extra){var m=(xa+xb)/2;return '<path d="M'+xa+' '+ya+' C'+m+' '+ya+' '+m+' '+yb+' '+xb+' '+yb+' L'+xb+' '+(yb+ht)+' C'+m+' '+(yb+ht)+' '+m+' '+(ya+ht)+' '+xa+' '+(ya+ht)+' Z" fill="'+fill+'" '+(extra||'')+'/>'}
    h+=band(x1+w,yJ,x2,yJ,JUDGED*u,C.g4);
    h+=band(x1+w,yP,x2,y2P,PENDING*u,'#fff','stroke="'+C.g3+'" stroke-width="1.5" stroke-dasharray="6 5"');
    h+=band(x2+w,yJ,x3,y3H,HITS*u,C.tint);
    h+=band(x2+w,yJ+HITS*u,x3,y3M,MISS*u,C.g5);
    h+='<rect x="'+x1+'" y="'+top+'" width="'+w+'" height="'+REG*u+'" fill="'+C.g2+'"/>';
    h+='<rect x="'+x2+'" y="'+yJ+'" width="'+w+'" height="'+JUDGED*u+'" fill="'+C.g1+'"/>';
    h+='<rect x="'+x2+'" y="'+y2P+'" width="'+w+'" height="'+PENDING*u+'" fill="#fff" stroke="'+C.g2+'" stroke-width="1.5"/>';
    h+='<rect x="'+x3+'" y="'+y3H+'" width="'+w+'" height="'+HITS*u+'" fill="'+C.acc+'"/>';
    h+='<rect x="'+x3+'" y="'+y3M+'" width="'+w+'" height="'+MISS*u+'" fill="'+C.g3+'"/>';
    h+=T(x1-18,top+REG*u/2+8,REG,{fs:52,c:C.g1,a:'end',w:700,f:NUM})+T(x1-18,top+REG*u/2+40,'登记',{fs:18,a:'end'});
    h+=T(x2+w+18,yJ+50,JUDGED,{fs:44,c:C.ink,w:700,f:NUM})+T(x2+w+20,yJ+78,'开奖',{fs:18});
    h+=T(x2+w+18,y2P+PENDING*u/2+4,PENDING,{fs:36,c:C.g2,w:700,f:NUM})+T(x2+w+20,y2P+PENDING*u/2+32,'待判',{fs:18,c:C.g2});
    h+=T(x3+w+22,y3H+HITS*u/2+44,HITS,{fs:150,c:C.acc,w:800,f:NUM})+T(x3+w+206,y3H+HITS*u/2-18,'命中',{fs:22,c:C.acc,w:700})+T(x3+w+206,y3H+HITS*u/2+34,(HITS/JUDGED*100).toFixed(0)+'%',{fs:40,c:C.acc,w:300,f:NUM});
    h+=T(x3+w+22,y3M+MISS*u/2+16,MISS,{fs:48,c:C.g2,w:700,f:NUM})+T(x3+w+66,y3M+MISS*u/2+12,'未中',{fs:18,c:C.g2});
    $('#s1').innerHTML=h;
  })();

  /* ---------- 02 箭头轴 · 骨架取自 catalog/slides/0915-e7ee-03-3.jpg ---------- */
  (function(){
    var y=400, h='';
    h+='<rect x="800" y="190" width="416" height="440" fill="'+C.tint2+'"/>';
    h+='<rect x="64" y="'+(y-8)+'" width="1116" height="16" fill="'+C.acc+'"/><path d="M1172 '+(y-26)+' L1216 '+y+' L1172 '+(y+26)+' Z" fill="'+C.acc+'"/>';
    var N=[[230,'Write','Gemini 写','概率 · 阈值 · 截止日',1],[560,'Check','Claude 核','算术 · 费率 · 措辞',-1],[900,'Grade','脚本判','只认官方净值',1]];
    N.forEach(function(n){
      var x=n[0], d=n[4];                                           // d=1：大字在线上方、说明在下方；d=-1 反过来
      h+='<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+d*104)+'" stroke="'+C.g2+'" stroke-width="1.5"/>';
      h+='<circle cx="'+x+'" cy="'+y+'" r="17" fill="#fff" stroke="'+C.g2+'" stroke-width="2"/>';
      h+=T(x+34,d>0?y-34:y+66,n[1],{fs:46,c:C.acc2,w:300,f:NUM});
      h+=T(x+18,d>0?y+122:y-146,n[2],{fs:26,c:C.ink,w:800});
      h+=T(x+18,d>0?y+156:y-112,n[3],{fs:17,c:C.g1});
    });
    $('#s2').innerHTML=h;
  })();

  /* ---------- 03 斜率图 · 骨架取自 catalog/slides/0709-cdc1-06-2.jpg ---------- */
  (function(){
    var xa=430, xb=850, Y=function(p){return 640-(p-.4)/.6*430}, h='';
    var B=[['p &lt; 0.60',function(p){return p<.6}],['0.60 – 0.69',function(p){return p>=.6&&p<.7}],['p ≥ 0.70',function(p){return p>=.7}]];
    h+='<line x1="'+xa+'" y1="200" x2="'+xa+'" y2="650" stroke="'+C.g3+'"/><line x1="'+xb+'" y1="200" x2="'+xb+'" y2="650" stroke="'+C.g3+'"/>';
    h+=T(xa,182,'声称概率',{fs:18,a:'middle'})+T(xb,182,'实际命中',{fs:18,a:'middle'});
    // 参照：若报得准，线是平的
    h+='<line x1="'+xa+'" y1="'+Y(claim)+'" x2="'+xb+'" y2="'+Y(claim)+'" stroke="'+C.g2+'" stroke-width="1.5" stroke-dasharray="5 5"/>'+T(xb+16,Y(claim)+6,'平线 = 报得准',{fs:15,c:C.g2});
    var ends={};
    B.forEach(function(b){
      var L=P.filter(function(r){return b[1](r[0])}), c=avg(L.map(function(r){return r[0]})), a=sum(L.map(function(r){return r[1]}))/L.length;
      h+='<line x1="'+xa+'" y1="'+Y(c)+'" x2="'+xb+'" y2="'+Y(a)+'" stroke="'+C.g3+'" stroke-width="2.5"/><circle cx="'+xa+'" cy="'+Y(c)+'" r="5.5" fill="'+C.g2+'"/><circle cx="'+xb+'" cy="'+Y(a)+'" r="5.5" fill="'+C.g2+'"/>';
      h+=T(xa-18,Y(c)+6,b[0]+'　'+(c*100).toFixed(0)+'%',{fs:16,c:C.g1,a:'end',f:NUM});
      var k=(a*100).toFixed(0); ends[k]=(ends[k]||0)+1; if(ends[k]===1) h+=T(xb+16,Y(a)+(a>actual?-4:20),k+'%',{fs:16,c:C.g1,f:NUM});
    });
    h+='<line x1="'+xa+'" y1="'+Y(claim)+'" x2="'+xb+'" y2="'+Y(actual)+'" stroke="'+C.acc+'" stroke-width="6" stroke-linecap="round"/><circle cx="'+xa+'" cy="'+Y(claim)+'" r="9" fill="'+C.acc+'"/><circle cx="'+xb+'" cy="'+Y(actual)+'" r="9" fill="'+C.acc+'"/>';
    h+=T(xa-200,Y(claim)-56,(claim*100).toFixed(0)+'%',{fs:56,c:C.acc,a:'end',w:300,f:NUM});
    h+=T(xb+110,Y(actual)+34,(actual*100).toFixed(0)+'%',{fs:120,c:C.acc,w:800,f:NUM});
    h+=T(xb+118,Y(actual)+72,'14 / 17',{fs:24,c:C.acc2,f:NUM});
    $('#s3').innerHTML=h;
  })();

  /* ---------- 04 瀑布图 · 骨架取自 catalog/slides/1008-f632-02-2.jpg ---------- */
  (function(){
    var y0=236, k=.222, W=98, G=44, x0=96, h='', run=0, Y=function(v){return y0-v*k};
    h+='<line x1="64" y1="'+y0+'" x2="1216" y2="'+y0+'" stroke="'+C.g2+'"/>'+T(64,y0-10,'0',{fs:14,c:C.g2,f:NUM});
    F.forEach(function(f,i){
      var x=x0+i*(W+G), a=Y(run), b=Y(run+f[2]), top=Math.min(a,b), ht=Math.max(Math.abs(b-a),2), hi=i===0;
      h+='<rect x="'+x+'" y="'+top+'" width="'+W+'" height="'+ht+'" fill="'+(hi?C.acc:C.g4)+'"/>';
      if(hi) h+=T(x+W/2,top+ht/2+12,fmt(f[2],0),{fs:30,c:'#fff',a:'middle',w:700,f:NUM});
      else h+=T(x+W/2,f[2]<0?b+26:top-10,(f[2]>0?'+':'')+fmt(f[2],0),{fs:20,c:C.g1,a:'middle',f:NUM});
      h+='<line x1="'+(x+W)+'" y1="'+b+'" x2="'+(x+W+G)+'" y2="'+b+'" stroke="'+C.g2+'" stroke-dasharray="3 4"/>';
      h+=T(x+W/2,646,f[1],{fs:17,c:hi?C.ink:C.g1,a:'middle',w:hi?800:400})+T(x+W/2,668,f[0],{fs:13,c:C.g2,a:'middle',f:NUM});
      run+=f[2];
    });
    var xt=x0+6*(W+G);
    h+='<rect x="'+xt+'" y="'+y0+'" width="'+W+'" height="'+(-pnl*k)+'" fill="#fff" stroke="'+C.ink+'" stroke-width="2"/>';
    h+=T(xt+W/2,Y(pnl)-52,fmt(pnl,0),{fs:26,c:C.ink,a:'middle',w:800,f:NUM})+T(xt+W/2,Y(pnl)-22,fmt(pnl/PRINCIPAL*100,2)+'%',{fs:18,c:C.g1,a:'middle',f:NUM});
    h+=T(xt+W/2,646,'合计',{fs:17,c:C.ink,a:'middle',w:800});
    // 唯一的大数字：最大一块占净亏损的比例
    h+=T(x0+W+G+4,Y(0)+150,(F[0][2]/pnl*100).toFixed(0)+'%',{fs:120,c:C.acc,w:800,f:NUM})+T(x0+W+G+10,Y(0)+186,'占净亏损',{fs:20,c:C.acc2});
    $('#s4').innerHTML=h;
  })();

  /* ---------- 05 大数字卡 + 两个选项 + 三步 · 骨架取自 catalog/slides/0709-cdc1-02-2.jpg ---------- */
  (function(){
    var h='<defs><filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity=".22"/></filter></defs>';
    // 主卡：17 / 30
    h+='<rect x="64" y="176" width="300" height="250" rx="10" fill="'+C.tint2+'" stroke="'+C.acc2+'" stroke-width="1.5" filter="url(#sh)"/>';
    h+='<rect x="236" y="162" width="118" height="30" fill="'+C.g3+'"/>'+T(295,183,'带概率样本',{fs:15,c:C.ink,a:'middle'});
    h+=T(92,330,P.length,{fs:150,c:C.acc,w:400,f:SERIF,i:1})+T(268,330,'/ 30',{fs:34,c:C.acc2,f:SERIF,i:1});
    h+='<rect x="92" y="372" width="244" height="10" rx="5" fill="#fff"/><rect x="92" y="372" width="'+(244*P.length/30)+'" height="10" rx="5" fill="'+C.acc+'"/>';
    // 分叉到两个选项
    h+='<path d="M214 426 V452 M124 452 H304 M124 452 V474 M304 452 V474" fill="none" stroke="'+C.g2+'" stroke-width="1.5"/>';
    h+='<rect x="64" y="474" width="120" height="118" rx="8" fill="'+C.g5+'" stroke="'+C.g3+'" filter="url(#sh)"/>'+T(124,524,'A',{fs:34,c:C.g2,a:'middle',w:700,f:NUM})+T(124,560,'现在调',{fs:18,c:C.g1,a:'middle'});
    h+='<rect x="244" y="474" width="120" height="118" rx="8" fill="#fff" stroke="'+C.acc+'" stroke-width="2.5" filter="url(#sh)"/>'+T(304,524,'B',{fs:34,c:C.acc,a:'middle',w:800,f:NUM})+T(304,560,'满 30 条再调',{fs:17,c:C.acc,a:'middle',w:700});
    h+='<rect x="276" y="462" width="56" height="24" rx="12" fill="'+C.acc+'"/>'+T(304,479,'建议',{fs:14,c:'#fff',a:'middle'});
    h+=T(214,632,'由您决定',{fs:16,c:C.g2,a:'middle',ls:4});
    // 副卡：Brier
    h+='<rect x="404" y="176" width="220" height="416" rx="10" fill="'+C.g5+'" filter="url(#sh)"/>';
    h+=T(514,224,'Brier',{fs:24,c:C.g1,a:'middle',f:NUM})+T(514,330,brier.toFixed(4),{fs:54,c:C.acc,a:'middle',f:SERIF,i:1});
    h+='<line x1="444" y1="390" x2="584" y2="390" stroke="'+C.g3+'"/>'+T(514,462,'0.25',{fs:40,c:C.g2,a:'middle',f:SERIF,i:1})+T(514,498,'基准',{fs:17,c:C.g2,a:'middle'});
    // 分隔与右侧三步
    h+='<line x1="664" y1="160" x2="664" y2="640" stroke="'+C.g2+'" stroke-dasharray="2 6" stroke-width="1.5"/>';
    [['01','新旧分开记分'],['02','统一口径'],['03','满 30 条复盘']].forEach(function(s,i){
      var y=250+i*140;
      h+=T(704,y,s[0],{fs:76,c:C.g3,w:800,f:NUM})+'<path d="M840 '+(y-28)+' l10 10 l18 -22" fill="none" stroke="'+C.acc+'" stroke-width="3"/>'+T(884,y-16,s[1],{fs:26,c:C.ink,w:700});
      if(i<2) h+='<line x1="704" y1="'+(y+44)+'" x2="1216" y2="'+(y+44)+'" stroke="'+C.g4+'" stroke-width="2"/>';
    });
    $('#s5').innerHTML=h;
  })();

  /* ---------- 翻页 ---------- */
  var S=$$('section'), nav=$('#nav'), cur=-1, stage=$('#stage');
  function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform='scale('+s+')';stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px'}
  addEventListener('resize',fit);fit();
  S.forEach(function(_,i){var d=document.createElement('i');d.onclick=function(e){e.stopPropagation();go(i)};nav.appendChild(d)});
  function go(n){n=Math.max(0,Math.min(S.length-1,n));if(n===cur)return;S.forEach(function(s,i){s.classList.toggle('on',i===n)});$$('#nav i').forEach(function(d,i){d.classList.toggle('on',i===n)});cur=n;try{history.replaceState(null,'','#'+(n+1))}catch(e){}}
  addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();go(cur+1)}else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(cur-1)}else if(/^[1-5]$/.test(k))go(+k-1)});
  stage.addEventListener('click',function(e){go(e.clientX>innerWidth/2?cur+1:cur-1)});
  var tx=null;addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1))});
  function fromHash(){var h=parseInt((location.hash||'').slice(1),10);go(h>=1&&h<=S.length?h-1:0)}
  addEventListener('hashchange',fromHash);fromHash();
})();
</script>
</body>
</html>
